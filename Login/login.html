<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — estudio.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrap">
  <a href="../Index/index.html" class="logo"><span>&lt;/&gt;</span> estudio.dev</a>

  <div class="login-card">
    <div class="tabs" id="authTabs">
      <button class="tab active" id="tabSignin" type="button">Iniciar sesión</button>
      <button class="tab" id="tabSignup" type="button">Crear cuenta</button>
    </div>

    <!-- ---- INICIAR SESIÓN (documento + contraseña) ---- -->
    <form id="signinForm" class="auth-form">
      <p class="sub">Entrá con tu número de documento para ver el progreso de tu proyecto y tus pagos.</p>
      <div class="form-group">
        <label for="siDocumento">Número de documento</label>
        <input type="text" id="siDocumento" inputmode="numeric" placeholder="Ej: 1035678900" required>
      </div>
      <div class="form-group">
        <label for="siPass">Contraseña</label>
        <input type="password" id="siPass" placeholder="••••••••" required>
      </div>
      <div class="form-error" id="signinError"></div>
      <button type="submit" class="submit-btn" id="signinBtn">Ingresar</button>
    </form>

    <!-- ---- CREAR CUENTA ---- -->
    <form id="signupForm" class="auth-form" style="display:none;">
      <p class="sub">Creá tu cuenta para hacer seguimiento a tu proyecto.</p>
      <div class="form-group">
        <label for="suName">Nombre y apellidos</label>
        <input type="text" id="suName" placeholder="Tu nombre completo" required>
      </div>
      <div class="form-group">
        <label for="suDocumento">Número de documento</label>
        <input type="text" id="suDocumento" inputmode="numeric" placeholder="Ej: 1035678900" required>
      </div>
      <div class="form-group">
        <label for="suEmail">Correo electrónico</label>
        <input type="email" id="suEmail" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label for="suPhone">Número de celular</label>
        <input type="tel" id="suPhone" inputmode="tel" placeholder="Ej: 3001234567" required>
      </div>
      <div class="form-group">
        <label for="suPass">Contraseña</label>
        <input type="password" id="suPass" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>
      <div class="form-error" id="signupError"></div>
      <button type="submit" class="submit-btn" id="signupBtn">Crear cuenta</button>
    </form>

    <!-- ---- ÉXITO AL CREAR CUENTA ---- -->
    <div class="signup-success" id="signupSuccess">
      <div class="success-icon">
        <svg width="20" height="20" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>¡Cuenta creada!</h2>
      <p id="signupSuccessMsg">Revisá tu email para confirmar tu cuenta antes de ingresar.</p>
      <button type="button" class="submit-btn" id="goToSigninBtn">Ir a iniciar sesión</button>
    </div>
  </div>

  <a href="../Index/index.html" class="back-link">← Volver al sitio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="login.js" defer></script>
</body>
</html>
